<style>

.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}

<script>
// Same sample numbers as the current dashboard capture (2026-10-01 ~ 10-20).
const DAYS = Array.from({length:20},(_,i)=>i+1);
// 10/1(목)~10/20(화). 주말·개천절·한글날은 휴무(0건). 합계 1,423건 × 7,000원 = 9,961,000원.
const CLOSED = new Set([3,4,9,10,11,17,18]);
const OPEN_COUNTS = [108,96,112,118,121,114,110,117,124,98,105,112,88];
const COUNTS = (()=>{let k=0; return DAYS.map(d=> CLOSED.has(d) ? 0 : OPEN_COUNTS[k++]);})();
const AMOUNTS = COUNTS.map(c=>c*7000);
const TOTAL_AMOUNT = 9961000, TOTAL_COUNT = 1423;
const BY_AMOUNT = [['한빛테크',3150000],['초록물산',2471000],['대성정밀',1890000],['미래로직스',1120000],['개인 구매',980000]];
const BY_COUNT = [['한빛테크',450],['초록물산',353],['대성정밀',270],['미래로직스',160],['개인 구매',140]];
const MEAL = [['중식',78,1110,7770000],['석식',22,313,2191000]];
const FEED = [['12:50','김민준','한빛테크','식권'],['12:46','이서연','초록물산','장부'],['12:42','박도윤','대성정밀','식권'],['12:38','최하은','한빛테크','식권'],['12:34','정우진','초록물산','장부'],['12:30','강지우','대성정밀','식권'],['12:26','김민준','한빛테크','식권']];
const won = n => n.toLocaleString('ko-KR');
const ic = id => `<svg class="ic"><use href="#i-${id}"/></svg>`;

const NAV = [['home','대시보드'],['live','실시간 매출'],null,['biz','업체 정보'],['settle','매출 정산'],['doc','증빙 내역'],null,['cup','식당 관리'],['gear','공급자 정보']];
function sideNav(groups){
  let g=0, out='';
  NAV.forEach((n,i)=>{
    if(!n){ out+= groups ? `<div class="grp">${groups[++g]}</div>` : '<div style="height:14px"></div>'; return; }
    out+=`<a class="${i===0?'on':''}">${ic(n[0])}${n[1]}</a>`;
  });
  return (groups?`<div class="grp" style="padding-top:0">${groups[0]}</div>`:'')+out;
}
function side(logo, groups){
  return `<aside class="side"><div class="logo-wrap"><img class="logo" src="../../apps/admin/public/brand/${logo}" alt="그린잇"></div>
  <nav class="nav">${sideNav(groups)}</nav>
  <div class="foot"><div style="display:flex;gap:10px;margin-bottom:10px;opacity:1">${ic('refresh')}새로고침</div><div style="display:flex;gap:10px;margin-bottom:14px">${ic('out')}로그아웃</div>개인정보 처리방침 · 이용약관</div></aside>`;
}
function delta(v, txt='전 기간 대비'){ return `<div class="delta">${ic('up')}${v}% <i>${txt}</i></div>`; }

// Charts ---------------------------------------------------------------
function area(w,h,vals,{stroke,fill,grid='#eef0f5',axis='#8a93a6',pad=[14,8,22,40],bars=null,barFill=null,labelsEvery=3,fmt=v=>v}={}){
  const [t,r,b,l]=pad, W=w-l-r, H=h-t-b, max=Math.max(...vals)*1.12;
  const x=i=>l+ (vals.length===1?0: i*(W/(vals.length-1))), y=v=>t+H-(v/max)*H;
  let g='';
  for(let k=0;k<=3;k++){const yy=t+H*k/3; g+=`<line x1="${l}" x2="${w-r}" y1="${yy}" y2="${yy}" stroke="${grid}"/><text x="${l-8}" y="${yy+4}" font-size="10.5" text-anchor="end" fill="${axis}">${fmt(Math.round(max*(1-k/3)))}</text>`;}
  let lbl=''; vals.forEach((_,i)=>{ if(i%labelsEvery===0) lbl+=`<text x="${x(i)}" y="${h-4}" font-size="10.5" text-anchor="middle" fill="${axis}">10.${String(i+1).padStart(2,'0')}</text>`;});
  let barsSvg='';
  if(bars){ const bw=W/vals.length*0.56, bmax=Math.max(...bars)*1.12; bars.forEach((v,i)=>{const bh=(v/bmax)*H; barsSvg+=`<rect x="${x(i)-bw/2}" y="${t+H-bh}" width="${bw}" height="${bh}" rx="3" fill="${barFill}"/>`;}); }
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const id='g'+Math.random().toString(36).slice(2,7);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" height="${h}"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${fill}" stop-opacity=".28"/><stop offset="1" stop-color="${fill}" stop-opacity="0"/></linearGradient></defs>${g}${barsSvg}
   ${fill?`<polygon points="${l},${t+H} ${pts} ${x(vals.length-1)},${t+H}" fill="url(#${id})"/>`:''}
   <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${lbl}</svg>`;
}
function bars(w,h,vals,{fill,today='#2c5fff',closed='#c3c8d2',grid='#eef0f5',axis='#8a93a6',pad=[14,6,24,44],fmt=v=>v,every=2,line=null,lineColor='#14b8a6',radius=4}={}){
  const [t,r,b,l]=pad, W=w-l-r, H=h-t-b, max=Math.max(...vals)*1.15, n=vals.length, slot=W/n, bw=Math.min(28,slot*0.62);
  let g='';
  for(let k=0;k<=3;k++){const yy=t+H*k/3; g+=`<line x1="${l}" x2="${w-r}" y1="${yy}" y2="${yy}" stroke="${grid}"/><text x="${l-8}" y="${yy+4}" font-size="10.5" text-anchor="end" fill="${axis}">${fmt(Math.round(max*(1-k/3)))}</text>`;}
  let out='';
  vals.forEach((v,i)=>{
    const cx=l+slot*i+slot/2, d=i+1;
    if(v===0){ if(slot>=24) out+=`<text x="${cx}" y="${t+H-6}" font-size="10" text-anchor="middle" fill="${closed}">휴무</text>`; }
    else { const bh=(v/max)*H; out+=`<rect x="${cx-bw/2}" y="${t+H-bh}" width="${bw}" height="${bh}" rx="${radius}" fill="${i===n-1?today:fill}"/>`; }
    if((i%every===0 && i<n-2) || i===n-1) out+=`<text x="${cx}" y="${h-6}" font-size="10.5" text-anchor="middle" fill="${i===n-1?today:axis}" font-weight="${i===n-1?700:400}">${i===n-1?'오늘':'10.'+String(d).padStart(2,'0')}</text>`;
  });
  if(line){ const lm=Math.max(...line)*1.15; const pts=line.map((v,i)=>v?`${l+slot*i+slot/2},${t+H-(v/lm)*H}`:null).filter(Boolean).join(' ');
    out+=`<polyline points="${pts}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linejoin="round" stroke-dasharray="0"/>`; }
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" height="${h}">${g}${out}</svg>`;
}
function spark(vals,color,w=120,h=36){
  const max=Math.max(...vals), x=i=>i*(w/(vals.length-1)), y=v=>h-2-(v/max)*(h-4);
  const bw=w/vals.length*0.6;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${vals.map((v,i)=>v?`<rect x="${i*(w/vals.length)}" y="${h-(v/max)*(h-2)}" width="${bw}" height="${(v/max)*(h-2)}" rx="1.5" fill="${color}" opacity="${i===vals.length-1?1:.45}"/>`:'').join('')}</svg>`;
}
function donut(size,colors,track){
  const r=size/2-10, c=2*Math.PI*r, a=MEAL[0][1]/100*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="14"/>
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${colors[1]}" stroke-width="14" stroke-dasharray="${c} ${c}"/>
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${colors[0]}" stroke-width="14" stroke-dasharray="${a} ${c}" stroke-linecap="butt"/></svg>`;
}
function mealList(colors){ return `<div class="lg">${MEAL.map((m,i)=>`<div style="--c:${colors[i]}">${m[0]}<i class="num">${won(m[2])}건</i><b class="num">${m[1]}%</b></div>`).join('')}</div>`; }
function rank(rows,unit,max){ return `<div class="rank">${rows.map((r,i)=>`<div class="r"><b class="num">${i+1}</b><span class="nm">${r[0]}</span><span class="num" style="font-weight:700">${won(r[1])}${unit}</span><div class="bar"><i style="width:${r[1]/max*100}%"></i></div></div>`).join('')}</div>`; }

function calendar(){

function treemap(items,W,H){
  // slice-and-dice, alternating direction, largest first
  const out=[]; let x=0,y=0,w=W,h=H, rest=items.slice(), total=rest.reduce((a,i)=>a+i.v,0), horiz=true;
  while(rest.length){
    const it=rest.shift();
    if(!rest.length){ out.push({...it,x,y,w,h}); break; }
    const f=it.v/total;
    if(horiz){ const ww=w*f; out.push({...it,x,y,w:ww,h}); x+=ww; w-=ww; }
    else { const hh=h*f; out.push({...it,x,y,w,h:hh}); y+=hh; h-=hh; }
    total-=it.v; horiz=!horiz;
  }
  return out;
}

   <div class="lead" style="padding:6px 0"><span>9월 같은 기간 대비</span><span class="dots"></span><b class="num" style="color:#2c5fff">+12.4% · +8.1%</b></div></div>
  <span class="pno" style="right:36px">13</span></div>
</div></div></div></div>`});

// ---------- S6 Week Tickets ----------
function weekTicket(wk,i){
  const open=wk.filter(d=>COUNTS[d-1]>0), sum=wk.reduce((a,d)=>a+COUNTS[d-1],0), now=i===WEEKS.length-1;
  const avg=open.length?Math.round(sum/open.length):0, max=124;
  const bars=wk.map(d=>{const c=COUNTS[d-1];return `<div>${c?`<b class="num">${c}</b><i class="${d===20?'t':''}" style="height:${Math.round(c/max*230)}px"></i>`:'<i class="o"></i>'}<span>${d===20?'오늘':DN(d)}</span></div>`;}).join('');
  return `<div class="wt ${now?'now':''}"><div class="hd3"><span class="kick" style="${now?'color:#2c5fff':''}">WEEK ${i+1} · 10.${String(wk[0]).padStart(2,'0')}–${String(wk[wk.length-1]).padStart(2,'0')}${now?' · 진행 중':''}</span><div class="v num">${won(sum)}<em>건</em></div><div class="num" style="font-size:13px;font-weight:700;color:#7a7364">${won(sum*7000)}원</div></div>
   <div class="mb">${bars}</div><div class="ftw"><span>영업 ${open.length}일 · 휴무 ${wk.length-open.length}일</span><b class="num">평균 ${avg}건</b></div></div>`;
}
V.push({id:'s6', name:'17-6 Week Tickets', note:'한 주 = 식권 한 장 — 주차별 티켓에 그 주의 요일별 막대, 이번 주는 파란 테두리. 지난주와 이번 주 비교가 쉬움', html:`
<div class="frame T s6">${SIDE}
<div class="main">${head()}
<div class="content">
 <div style="grid-column:1/3">${T({c:'blue',stub:150,k:'OCTOBER · 총 매출',am:won(TOTAL_AMOUNT),rb:'+12.4%',rs:'9월 대비',st:'height:100%',size:'font-size:40px'})}</div>
 ${T({k:'총 수량',am:won(TOTAL_COUNT),u:'건',rb:'+8.1%',rs:'9월 대비',st:'height:100%'})}
 ${T({c:'ink',k:'중식 · 석식 (%)',am:`${MEAL[0][1]} / ${MEAL[1][1]}`,u:'',rb:AVG,rs:'하루 평균',st:'height:100%'})}
 ${WEEKS.map(weekTicket).join('')}
 <div class="pane" style="grid-column:1/5;display:grid;grid-template-columns:120px repeat(5,1fr);gap:14px;align-items:center;padding:16px 20px">
  <div><h3>거래처</h3><div style="font-size:12px;color:#8a93a6;margin-top:4px">이번 달 매출순</div></div>
  ${COMP.map((r,i)=>T({c:i===0?'blue':'',stub:72,bg:'#131a2a',k:`NO.${i+1}`,nm:r.n,am:Math.round(r.a/10000).toLocaleString('ko-KR'),u:'만원',rb:won(r.c),rs:'건',st:'height:96px',size:'font-size:18px;margin-top:2px'}).replace('<div class="nm">','<div class="nm" style="font-size:14.5px">')).join('')}
 </div>
</div></div></div>`});

// ---------- S7 Kitchen Order Rail ----------
const ORD = [{today:true}, ...COMP];
V.push({id:'s7', name:'17-7 Order Rail', note:'주방 주문서 레일 — 거래처별 주문서가 레일에 걸려 있고 길이가 곧 식사량. 식당 사장님에게 가장 익숙한 장면', html:`
<div class="frame T s7">${SIDE}
<div class="main">${head()}
<div class="content">
 <div style="display:flex;gap:52px;align-items:flex-end;padding:0 4px">
  <div class="kpi"><div class="lab" style="color:#8a93a6">총 매출</div><div class="val num" style="color:#fff">${won(TOTAL_AMOUNT)}<em style="color:#8a93a6">원</em></div><div class="delta" style="color:#7fa2ff">▲ 12.4% <i>9월 대비</i></div></div>
  <div class="kpi"><div class="lab" style="color:#8a93a6">총 수량</div><div class="val num" style="color:#fff">${won(TOTAL_COUNT)}<em style="color:#8a93a6">건</em></div><div class="delta" style="color:#7fa2ff">▲ 8.1%</div></div>
  <div class="kpi"><div class="lab" style="color:#8a93a6">중식 / 석식</div><div class="val num" style="color:#fff">${MEAL[0][1]}<em style="color:#8a93a6">%</em> / ${MEAL[1][1]}<em style="color:#8a93a6">%</em></div><div class="delta" style="color:#8a93a6">하루 평균 ${AVG}건</div></div>
 </div>
 <div style="padding-top:16px"><div class="railbar"></div>
  <div class="orders">${ORD.map((r,i)=>{
    const rot=[-2.5,1.5,-1,2,-1.8,1][i];
    if(r.today) return `<div class="ord blue" style="transform:rotate(${rot}deg)"><div class="no">TODAY · 10.20 화</div><div class="nm">오늘 주문</div><hr><div class="big num">${TODAY_COUNT}<span style="font-size:15px;margin-left:2px">건</span></div><div class="ln"><span>매출</span><b class="num">${won(TODAY_AMOUNT)}</b></div><div class="ln"><span>마지막</span><b class="num">12:50</b></div><div class="ln"><span>석식</span><b>17:30~</b></div><hr><div class="ln"><span>식권</span><b class="num">64건</b></div><div class="ln"><span>장부</span><b class="num">24건</b></div><div class="ln"><span>지난주 화</span><b class="num">82건</b></div></div>`;
    const lines=Math.round(r.c/COMP[0].c*26);
    return `<div class="ord" style="transform:rotate(${rot}deg)"><div class="no">ORDER #0${i} · ${pct(r.a)}%</div><div class="nm">${r.n}</div><hr><div class="ln"><span>식사</span><b class="num">${won(r.c)}건</b></div><div class="ln"><span>매출</span><b class="num">${won(r.a)}</b></div><div class="fill">${'<i></i>'.repeat(lines)}</div></div>`;}).join('')}</div></div>
 <div class="pane"><h3>일별 매출<small>원 · 파란 막대 = 오늘</small></h3><div style="margin-top:6px">${bars(1100,150,AMOUNTS,{fill:'#f4f1e9',today:'#2c5fff',grid:'#1b2436',axis:'#6b7489',closed:'#3d4a66',fmt:kfmt,radius:3})}</div></div>
</div></div></div>`});

// ---------- S8 Calm Dark ----------
const dkT = ({c='',k,am,u,rb,rs}) => `<div class="dk ${c}" style="grid-column:span 3"><div class="l"><small>${k}</small><div class="am num">${am}<em>${u}</em></div></div><div class="r"><b class="num">${rb}</b><span>${rs}</span></div></div>`;
V.push({id:'s8', name:'17-8 Calm Dark', note:'티켓 느낌은 홈 파임·절취선으로만 살린 차분한 다크 — 매일 오래 보는 업무 화면용, 실제 적용이 가장 쉬운 안', html:`
<div class="frame T s8">${SIDE}
<div class="main">${head()}
<div class="content">
 ${dkT({c:'b',k:'총 매출',am:won(TOTAL_AMOUNT),u:'원',rb:'+12.4%',rs:'9월 대비'})}
 ${dkT({k:'총 수량',am:won(TOTAL_COUNT),u:'건',rb:'+8.1%',rs:'9월 대비'})}
 ${dkT({k:'오늘',am:TODAY_COUNT,u:'건',rb:'+6',rs:'지난주 대비'})}
 ${dkT({k:'중식 · 석식',am:`${MEAL[0][1]} / ${MEAL[1][1]}`,u:'%',rb:AVG,rs:'하루 평균'})}
 <div class="dp" style="grid-column:span 8"><h3>일별 매출<small>원 · 파란 막대 = 오늘</small></h3><div style="margin-top:10px">${bars(700,290,AMOUNTS,{fill:'#2a3550',today:'#2c5fff',grid:'#1b2436',axis:'#6b7489',closed:'#3d4a66',fmt:kfmt})}</div></div>
 <div class="dp" style="grid-column:span 4;grid-row:span 2"><h3>거래처 TOP 5<small>매출 · 원</small></h3>${rank(BY_AMOUNT,'',BY_AMOUNT[0][1]).replace(/<span class="nm">/g,'<span class="nm" style="color:#e9edf5">')}
   <h3 style="margin-top:26px">식사 구분</h3><div class="donut" style="margin-top:12px">${donut(88,['#2c5fff','#3d4a66'],'#1b2436')}${mealList(['#2c5fff','#3d4a66'])}</div></div>
 <div class="dp" style="grid-column:span 8"><h3>방금 들어온 결제<small>오늘 · 실시간</small></h3><div style="margin-top:4px">${feed(FEED.slice(0,4),{dark:true})}</div></div>
</div></div></div>`});
document.getElementById('board').innerHTML = V.map(v=>`<section class="slot" id="${v.id}"><h2>${v.name}</h2><p>${v.note}</p>${v.html}</section>`).join('');
