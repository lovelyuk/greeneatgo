<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>관리자 대시보드 시안 2 · GreenEat Go</title>
<style>
@font-face{font-family:Pretendard;font-weight:400;src:url(../../apps/admin/public/fonts/Pretendard-Regular.otf)}
@font-face{font-family:Pretendard;font-weight:600;src:url(../../apps/admin/public/fonts/Pretendard-SemiBold.otf)}
@font-face{font-family:Pretendard;font-weight:700;src:url(../../apps/admin/public/fonts/Pretendard-Bold.otf)}
@font-face{font-family:Pretendard;font-weight:800;src:url(../../apps/admin/public/fonts/Pretendard-ExtraBold.otf)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,sans-serif;background:#d9dde5;padding:40px;color:#111;-webkit-font-smoothing:antialiased}
.slot{margin:0 auto 56px;width:1440px}
.slot>h2{font-size:22px;font-weight:800;margin-bottom:4px}
.slot>p{font-size:14px;color:#4a5263;margin-bottom:14px}
.frame{width:1440px;height:900px;overflow:hidden;border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.18);position:relative;display:flex}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{height:34px;display:block}

/* ---------- shared sidebar shapes ---------- */
.side{width:232px;flex:none;display:flex;flex-direction:column;padding:26px 16px 20px}
.side .logo-wrap{padding:0 10px 26px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:9px;font-size:14.5px;font-weight:600;text-decoration:none;color:inherit}
.nav .grp{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:18px 12px 6px;opacity:.5}
.side .foot{margin-top:auto;font-size:11.5px;opacity:.55;padding:0 12px;line-height:1.7}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:72px;display:flex;align-items:center;gap:16px;padding:0 32px;flex:none}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
.top .sp{flex:1}
.range{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:9px;font-size:13.5px;font-weight:600}
.btn{height:38px;padding:0 16px;border-radius:9px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;border:0}
.seg{display:flex;padding:3px;border-radius:10px;gap:2px}
.seg span{height:32px;padding:0 12px;display:flex;align-items:center;font-size:13px;font-weight:600;border-radius:7px}
.content{flex:1;padding:4px 32px 28px;display:grid;gap:16px;min-height:0}
.card{border-radius:14px;padding:20px 22px;min-width:0}
.card h3{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 small{margin-left:auto;font-size:12px;font-weight:500;opacity:.55}
.kpi .lab{font-size:13px;font-weight:600;opacity:.7}
.kpi .val{font-size:30px;font-weight:800;margin-top:8px}
.kpi .val em{font-style:normal;font-size:17px;font-weight:700;margin-left:2px;opacity:.75}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;margin-top:8px}
.delta i{font-style:normal;font-weight:500;opacity:.7}
.rank{margin-top:12px;display:flex;flex-direction:column}
.rank .r{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:9px 0;font-size:13.5px}
.rank .r b{font-weight:800;font-size:12.5px;opacity:.6}
.rank .r .nm{font-weight:600}
.rank .bar{grid-column:2/4;height:5px;border-radius:3px;margin-top:-4px}
.rank .bar i{display:block;height:100%;border-radius:3px}
.chart{width:100%;display:block}
.legend{display:flex;gap:14px;font-size:12px;font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.legend span:before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.feed .row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 0;font-size:13.5px}
.feed .row .t{font-weight:700;opacity:.6;font-size:12.5px}
.feed .row .who{font-weight:600}
.feed .row .who small{display:block;font-size:12px;font-weight:500;opacity:.6;margin-top:2px}
.pill{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px}
.donut{display:flex;align-items:center;gap:20px;margin-top:14px}
.donut .lg{flex:1;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.donut .lg div{display:flex;align-items:center;gap:8px;white-space:nowrap}
.donut .lg div:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.donut .lg b{margin-left:auto;font-weight:800}
.donut .lg i{font-style:normal;opacity:.55;font-size:12.5px;width:72px;text-align:right}


/* icon rail */
.rail{width:76px;flex:none;display:flex;flex-direction:column;align-items:center;padding:22px 0 18px;gap:6px}
.rail .mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:18px;margin-bottom:18px}
.rail a{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.rail a svg.ic{width:20px;height:20px}
.rail .sp{flex:1}

/* ---------- V7 Bento ---------- */
.v7{background:#eef1f6;color:#131a2a}
.v7 .rail{background:#fff;border-right:1px solid #e3e7ef}
.v7 .rail .mark{background:#2c5fff;color:#fff}
.v7 .rail a{color:#8a93a6}.v7 .rail a.on{background:#eef3ff;color:#2c5fff}
.v7 .range{background:#fff}
.v7 .seg{background:#e3e7ef}.v7 .seg span.on{background:#fff}
.v7 .content{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr)}
.v7 .tile{border-radius:20px;background:#fff;padding:22px 24px;min-width:0;min-height:0;overflow:hidden;position:relative}
.v7 .tile h3{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.v7 .tile h3 small{margin-left:auto;font-size:12px;font-weight:500;opacity:.55}
.v7 .tile.blue{background:#2c5fff;color:#fff}
.v7 .tile.ink{background:#131a2a;color:#fff}
.v7 .delta{color:#0f9d58}
.v7 .tile.blue .delta{color:#dfe7ff}
.v7 .rank .r{border-bottom:1px solid #f0f2f6}.v7 .rank .bar{background:#eef1f7}.v7 .rank .bar i{background:#2c5fff}

/* ---------- V8 Calendar ---------- */
.v8{background:#f6f7fb;color:#131a2a}
.v8 .side{background:#fff;border-right:1px solid #e8ebf2}
.v8 .nav a{color:#4a5263}.v8 .nav a.on{background:#eef3ff;color:#2c5fff}
.v8 .range{background:#fff;border:1px solid #e1e5ee}
.v8 .btn.p{background:#2c5fff;color:#fff}
.v8 .card{background:#fff;border:1px solid #e8ebf2}
.v8 .content{grid-template-columns:1fr 360px;grid-template-rows:auto 1fr auto}
.v8 .kline{grid-column:1/3;display:flex;gap:44px;align-items:flex-end;padding:2px 4px 4px}
.v8 .kline .val{font-size:28px}
.v8 .delta{color:#2c5fff}
.v8 .rank .r{border-bottom:1px solid #f0f2f6}.v8 .rank .bar{background:#eef1f7}.v8 .rank .bar i{background:#2c5fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}
.cal .dow{font-size:12px;font-weight:700;color:#8a93a6;padding-left:4px}
.cal .d{height:94px;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;font-size:12.5px;font-weight:600}
.cal .d b{font-size:22px;font-weight:800}
.cal .d.off{background:#f3f4f7;color:#a2a9b8}
.cal .d.fut{border:1px dashed #e3e6ee;color:#c3c8d2}
.cal .d.today{outline:2.5px solid #131a2a;outline-offset:2px}
.scale{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#8a93a6;font-weight:600}
.scale i{width:18px;height:10px;border-radius:3px;display:block}

/* ---------- V9 Flip Board ---------- */
.v9{background:#f4f6fa;color:#131a2a}
.v9 .side{background:#fff;border-right:1px solid #e8ebf2}
.v9 .nav a{color:#4a5263}.v9 .nav a.on{background:#131a2a;color:#fff}
.v9 .range{background:#fff;border:1px solid #e1e5ee}
.v9 .btn.p{background:#2c5fff;color:#fff}
.v9 .card{background:#fff;border:1px solid #e8ebf2}
.v9 .content{grid-template-columns:repeat(12,1fr);grid-template-rows:auto 1fr}
.v9 .hero{grid-column:1/13;background:#0a0d14;color:#fff;border-radius:18px;padding:26px 32px;display:grid;grid-template-columns:auto auto 1fr;gap:56px;align-items:center}
.v9 .hero .lab{font-size:13px;font-weight:600;color:#8a93a6}
.v9 .delta{color:#5b87ff}
.v9 .card .delta{color:#2c5fff}
.v9 .rank .r{border-bottom:1px solid #f0f2f6}.v9 .rank .bar{background:#eef1f7}.v9 .rank .bar i{background:#131a2a}
.flip{display:flex;gap:6px;margin-top:10px;align-items:flex-end}
.flip .t{width:54px;height:76px;border-radius:9px;background:#1b2436;position:relative;display:grid;place-items:center;font-size:48px;font-weight:800;color:#f4f1e9}
.flip .t:after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#0a0d14}
.flip .c{font-size:40px;font-weight:800;color:#5b87ff;width:12px;text-align:center;line-height:1}
.flip .u{font-size:20px;font-weight:700;color:#8a93a6;margin-left:6px;margin-bottom:6px}
.flip.sm .t{width:36px;height:52px;font-size:32px;border-radius:7px}
.flip.sm .c{font-size:26px;width:8px}
.split{height:12px;border-radius:6px;display:flex;overflow:hidden;margin-top:12px;background:#1b2436}
.split i{display:block;height:100%}

/* ---------- V10 Report Paper ---------- */
.v10{background:#e8e5dc;color:#1d2230}
.v10 .rail{background:#0a0d14}
.v10 .rail .mark{background:#2c5fff;color:#fff}
.v10 .rail a{color:#6b7489}.v10 .rail a.on{background:#1b2436;color:#fff}
.v10 .main{padding:30px 44px}
.paper{flex:1;background:#f4f1e9;border-radius:4px;box-shadow:0 1px 0 #d8d2c2,0 18px 40px rgba(40,34,20,.14);padding:34px 46px 30px;display:grid;grid-template-columns:1.05fr 1fr;grid-template-rows:auto 1fr;column-gap:52px;min-height:0}
.paper .hd{grid-column:1/3;display:flex;align-items:flex-end;gap:16px;padding-bottom:18px;border-bottom:3px double #cfc7b4;margin-bottom:8px}
.paper .hd small{font-size:11.5px;font-weight:800;letter-spacing:.18em;color:#8b8371}
.paper .hd h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.paper .hd p{font-size:13px;color:#7a7364;margin-top:6px}
.paper .hd .sp{flex:1}
.v10 .seg{background:#e8e2d3}.v10 .seg span.on{background:#f4f1e9;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lead{display:flex;align-items:baseline;gap:10px;padding:11px 0;font-size:15px;font-weight:600}
.lead .dots{flex:1;border-bottom:2px dotted #cfc7b4;transform:translateY(-4px)}
.lead b{font-weight:800}
.lead.big{font-size:17px}.lead.big b{font-size:30px;letter-spacing:-.03em}
.ptbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.ptbl th{font-size:12px;color:#8b8371;font-weight:700;text-align:left;padding:8px 6px;border-bottom:1.5px solid #1d2230}
.ptbl td{padding:12px 6px;border-bottom:1px solid #ddd5c3;font-weight:600}
.ptbl .n{text-align:right}
.ptbl tr.tot td{border-top:3px double #1d2230;border-bottom:0;font-weight:800}
.ph{font-size:13px;font-weight:800;letter-spacing:.06em;color:#8b8371;margin-top:16px}

/* ---------- V11 Split Stage ---------- */
.v11{background:#f5f7fb;color:#131a2a}
.v11 .rail{background:#fff;border-right:1px solid #e6e9f0}
.v11 .rail .mark{background:#0a0d14;color:#fff}
.v11 .rail a{color:#8a93a6}.v11 .rail a.on{background:#eef3ff;color:#2c5fff}
.stage{width:420px;flex:none;background:#0a0d14;color:#fff;padding:30px 32px;display:flex;flex-direction:column}
.stage .live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:#7fa2ff;background:rgba(44,95,255,.16);padding:5px 11px;border-radius:999px;align-self:flex-start}
.stage .live:before{content:"";width:7px;height:7px;border-radius:50%;background:#5b87ff;box-shadow:0 0 0 4px rgba(91,135,255,.25)}
.stage .feed .row{border-bottom:1px solid #1b2436}
.v11 .range{background:#fff;border:1px solid #e1e5ee}
.v11 .seg{background:#e9ecf2}.v11 .seg span.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.v11 .card{background:#fff;border:1px solid #e8ebf2}
.v11 .content{grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto 1fr}
.v11 .delta{color:#2c5fff}
.v11 .rank .r{border-bottom:1px solid #f0f2f6}.v11 .rank .bar{background:#eef1f7}.v11 .rank .bar i{background:#2c5fff}

/* ---------- V12 Compact Table ---------- */
.v12{background:#fff;color:#16181d}
.v12 .side{background:#fafafa;border-right:1px solid #ececef;width:216px;padding-top:22px}
.v12 .logo{height:28px}
.v12 .nav a{color:#5b5f6a;height:34px;font-size:13.5px}.v12 .nav a.on{background:#ececf0;color:#16181d}
.v12 .top{border-bottom:1px solid #ececef;height:60px;padding:0 28px}
.v12 .top h1{font-size:16px}
.v12 .crumb{font-size:13px;color:#8b8f99;font-weight:600}
.v12 .range{border:1px solid #e3e3e8;height:34px}
.v12 .seg{background:#f3f3f5}.v12 .seg span{height:28px}.v12 .seg span.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;border-bottom:1px solid #ececef}
.chips>div{flex:1;padding:18px 28px;border-right:1px solid #ececef}
.chips>div:last-child{border-right:0}
.chips .lab{font-size:12px;color:#7b7f8a;font-weight:600}
.chips .val{font-size:24px;font-weight:800;margin-top:6px}
.chips .val em{font-style:normal;font-size:14px;margin-left:2px;color:#7b7f8a}
.v12 .delta{color:#2c5fff;margin-top:4px;font-size:12px}
.v12 .sec{padding:20px 28px 8px}
.v12 .sec h3{font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center}
.v12 .sec h3 small{margin-left:auto;font-size:12px;color:#8b8f99;font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.tbl th{font-size:12px;color:#7b7f8a;font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid #ececef;background:#fafafa}
.tbl td{padding:11px 12px;border-bottom:1px solid #f2f2f4;font-weight:500}
.tbl .n{text-align:right}
.share{display:flex;align-items:center;gap:10px}.share span{flex:1;height:6px;border-radius:3px;background:#f0f0f3;overflow:hidden}.share i{display:block;height:100%;background:#2c5fff;border-radius:3px}
</style>

<script>
// Same sample numbers as the current dashboard capture (2026-10-01 ~ 10-20).
const DAYS = Array.from({length:20},(_,i)=>i+1);
// 10/1(목)~10/20(화). 주말·개천절·한글날은 휴무(0건). 합계 1,423건 × 7,000원 = 9,961,000원.
const CLOSED = new Set([3,4,9,10,11,17,18]);
const OPEN_COUNTS = [108,96,112,118,121,114,110,117,124,98,105,112,88];
const COUNTS = (()=>{let k=0; return DAYS.map(d=> CLOSED.has(d) ? 0 : OPEN_COUNTS[k++]);})();
const AMOUNTS = COUNTS.map(c=>c*7000);
const TOTAL_AMOUNT = 9961000, TOTAL_COUNT = 1423;
const BY_AMOUNT = [['한빛테크',3150000],['초록물산',2471000],['대성정밀',1890000],['미래로직스',1120000],['개인 구매',980000]];
const BY_COUNT = [['한빛테크',450],['초록물산',353],['대성정밀',270],['미래로직스',160],['개인 구매',140]];
const MEAL = [['중식',78,1110,7770000],['석식',22,313,2191000]];
const FEED = [['12:50','김민준','한빛테크','식권'],['12:46','이서연','초록물산','장부'],['12:42','박도윤','대성정밀','식권'],['12:38','최하은','한빛테크','식권'],['12:34','정우진','초록물산','장부'],['12:30','강지우','대성정밀','식권'],['12:26','김민준','한빛테크','식권']];
const won = n => n.toLocaleString('ko-KR');
const ic = id => `<svg class="ic"><use href="#i-${id}"/></svg>`;

const NAV = [['home','대시보드'],['live','실시간 매출'],null,['biz','업체 정보'],['settle','매출 정산'],['doc','증빙 내역'],null,['cup','식당 관리'],['gear','공급자 정보']];
function sideNav(groups){
  let g=0, out='';
  NAV.forEach((n,i)=>{
    if(!n){ out+= groups ? `<div class="grp">${groups[++g]}</div>` : '<div style="height:14px"></div>'; return; }
    out+=`<a class="${i===0?'on':''}">${ic(n[0])}${n[1]}</a>`;
  });
  return (groups?`<div class="grp" style="padding-top:0">${groups[0]}</div>`:'')+out;
}
function side(logo, groups){
  return `<aside class="side"><div class="logo-wrap"><img class="logo" src="../../apps/admin/public/brand/${logo}" alt="그린잇"></div>
  <nav class="nav">${sideNav(groups)}</nav>

}
function delta(v, txt='전 기간 대비'){ return `<div class="delta">${ic('up')}${v}% <i>${txt}</i></div>`; }

// Charts ---------------------------------------------------------------
function area(w,h,vals,{stroke,fill,grid='#eef0f5',axis='#8a93a6',pad=[14,8,22,40],bars=null,barFill=null,labelsEvery=3,fmt=v=>v}={}){
  const [t,r,b,l]=pad, W=w-l-r, H=h-t-b, max=Math.max(...vals)*1.12;
  const x=i=>l+ (vals.length===1?0: i*(W/(vals.length-1))), y=v=>t+H-(v/max)*H;
  let g='';
  for(let k=0;k<=3;k++){const yy=t+H*k/3; g+=`<line x1="${l}" x2="${w-r}" y1="${yy}" y2="${yy}" stroke="${grid}"/><text x="${l-8}" y="${yy+4}" font-size="10.5" text-anchor="end" fill="${axis}">${fmt(Math.round(max*(1-k/3)))}</text>`;}
  let lbl=''; vals.forEach((_,i)=>{ if(i%labelsEvery===0) lbl+=`<text x="${x(i)}" y="${h-4}" font-size="10.5" text-anchor="middle" fill="${axis}">10.${String(i+1).padStart(2,'0')}</text>`;});
  let barsSvg='';
  if(bars){ const bw=W/vals.length*0.56, bmax=Math.max(...bars)*1.12; bars.forEach((v,i)=>{const bh=(v/bmax)*H; barsSvg+=`<rect x="${x(i)-bw/2}" y="${t+H-bh}" width="${bw}" height="${bh}" rx="3" fill="${barFill}"/>`;}); }
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const id='g'+Math.random().toString(36).slice(2,7);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" height="${h}"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${fill}" stop-opacity=".28"/><stop offset="1" stop-color="${fill}" stop-opacity="0"/></linearGradient></defs>${g}${barsSvg}
   ${fill?`<polygon points="${l},${t+H} ${pts} ${x(vals.length-1)},${t+H}" fill="url(#${id})"/>`:''}
   <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${lbl}</svg>`;
}
function bars(w,h,vals,{fill,today='#2c5fff',closed='#c3c8d2',grid='#eef0f5',axis='#8a93a6',pad=[14,6,24,44],fmt=v=>v,line=null,lineColor='#14b8a6',radius=4}={}){
  const [t,r,b,l]=pad, W=w-l-r, H=h-t-b, max=Math.max(...vals)*1.15, n=vals.length, slot=W/n, bw=Math.min(28,slot*0.62);
  let g='';
  for(let k=0;k<=3;k++){const yy=t+H*k/3; g+=`<line x1="${l}" x2="${w-r}" y1="${yy}" y2="${yy}" stroke="${grid}"/><text x="${l-8}" y="${yy+4}" font-size="10.5" text-anchor="end" fill="${axis}">${fmt(Math.round(max*(1-k/3)))}</text>`;}
  let out='';
  vals.forEach((v,i)=>{
    const cx=l+slot*i+slot/2, d=i+1;
    if(v===0){ out+=`<text x="${cx}" y="${t+H-6}" font-size="10" text-anchor="middle" fill="${closed}">휴무</text>`; }
    else { const bh=(v/max)*H; out+=`<rect x="${cx-bw/2}" y="${t+H-bh}" width="${bw}" height="${bh}" rx="${radius}" fill="${i===n-1?today:fill}"/>`; }
    if(i%2===0 || i===n-1) out+=`<text x="${cx}" y="${h-6}" font-size="10.5" text-anchor="middle" fill="${i===n-1?today:axis}" font-weight="${i===n-1?700:400}">${i===n-1?'오늘':'10.'+String(d).padStart(2,'0')}</text>`;
  });
  if(line){ const lm=Math.max(...line)*1.15; const pts=line.map((v,i)=>v?`${l+slot*i+slot/2},${t+H-(v/lm)*H}`:null).filter(Boolean).join(' ');
    out+=`<polyline points="${pts}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linejoin="round" stroke-dasharray="0"/>`; }
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" height="${h}">${g}${out}</svg>`;
}
function spark(vals,color,w=120,h=36){
  const max=Math.max(...vals), x=i=>i*(w/(vals.length-1)), y=v=>h-2-(v/max)*(h-4);
  const bw=w/vals.length*0.6;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${vals.map((v,i)=>v?`<rect x="${i*(w/vals.length)}" y="${h-(v/max)*(h-2)}" width="${bw}" height="${(v/max)*(h-2)}" rx="1.5" fill="${color}" opacity="${i===vals.length-1?1:.45}"/>`:'').join('')}</svg>`;
}
function donut(size,colors,track){
  const r=size/2-10, c=2*Math.PI*r, a=MEAL[0][1]/100*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="14"/>
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${colors[1]}" stroke-width="14" stroke-dasharray="${c} ${c}"/>
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${colors[0]}" stroke-width="14" stroke-dasharray="${a} ${c}" stroke-linecap="butt"/></svg>`;
}
function mealList(colors){ return `<div class="lg">${MEAL.map((m,i)=>`<div style="--c:${colors[i]}">${m[0]}<i class="num">${won(m[2])}건</i><b class="num">${m[1]}%</b></div>`).join('')}</div>`; }
function rank(rows,unit,max){ return `<div class="rank">${rows.map((r,i)=>`<div class="r"><b class="num">${i+1}</b><span class="nm">${r[0]}</span><span class="num" style="font-weight:700">${won(r[1])}${unit}</span><div class="bar"><i style="width:${r[1]/max*100}%"></i></div></div>`).join('')}</div>`; }
const kfmt = v => v>=1e6 ? (v/1e6).toFixed(1)+'M' : v>=1e3 ? Math.round(v/1e3)+'K' : v;

function rail(mark){ return `<aside class="rail"><div class="mark">${mark}</div>${RAIL.map((r,i)=>`<a class="${i===0?'on':''}" title="${NAV.filter(Boolean)[i][1]}">${ic(r)}</a>`).join('')}<div class="sp"></div><a>${ic('out')}</a></aside>`; }
function flip(str, unit, cls=''){ return `<div class="flip ${cls}">${[...str].map(ch=>/\d/.test(ch)?`<span class="t num">${ch}</span>`:`<span class="c">${ch}</span>`).join('')}<span class="u">${unit}</span></div>`; }
function feed(rows,{dark=false}={}){ return `<div class="feed">${rows.map(f=>`<div class="row"><span class="t num">${f[0]}</span><span class="who">${f[1]}<small>${f[2]}</small></span><span class="pill" style="background:${dark?(f[3]==='식권'?'rgba(44,95,255,.2)':'#1b2436'):(f[3]==='식권'?'#eef3ff':'#f1f2f5')};color:${dark?(f[3]==='식권'?'#9db6ff':'#aab2c2'):(f[3]==='식권'?'#2c5fff':'#4a5263')}">${f[3]}</span></div>`).join('')}</div>`; }
function calendar(){
  const dows=['일','월','화','수','목','금','토'];
  let h=dows.map((d,i)=>`<div class="dow" style="${i===0?'color:#e5484d':''}">${d}</div>`).join('');
  for(let k=0;k<4;k++) h+='<div></div>';
  for(let d=1;d<=31;d++){
    if(d>20){h+=`<div class="d fut"><span>${d}</span></div>`;continue;}
    const c=COUNTS[d-1];
    if(!c){h+=`<div class="d off"><span>${d}</span><span>휴무</span></div>`;continue;}
    const r=(c-80)/(124-80), al=0.14+0.78*r, fg=al>0.55?'#fff':'#131a2a';
    h+=`<div class="d${d===20?' today':''}" style="background:rgba(44,95,255,${al.toFixed(2)});color:${fg}"><span>${d}${d===20?' · 오늘':''}</span><b class="num">${c}<small style="font-size:12px;font-weight:600;margin-left:2px">건</small></b></div>`;
  }
  return `<div class="cal">${h}</div>`;
}
