<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>관리자 대시보드 시안 · GreenEat Go</title>
<style>
@font-face{font-family:Pretendard;font-weight:400;src:url(../../apps/admin/public/fonts/Pretendard-Regular.otf)}
@font-face{font-family:Pretendard;font-weight:600;src:url(../../apps/admin/public/fonts/Pretendard-SemiBold.otf)}
@font-face{font-family:Pretendard;font-weight:700;src:url(../../apps/admin/public/fonts/Pretendard-Bold.otf)}
@font-face{font-family:Pretendard;font-weight:800;src:url(../../apps/admin/public/fonts/Pretendard-ExtraBold.otf)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,sans-serif;background:#d9dde5;padding:40px;color:#111;-webkit-font-smoothing:antialiased}
.slot{margin:0 auto 56px;width:1440px}
.slot>h2{font-size:22px;font-weight:800;margin-bottom:4px}
.slot>p{font-size:14px;color:#4a5263;margin-bottom:14px}
.frame{width:1440px;height:900px;overflow:hidden;border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.18);position:relative;display:flex}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{height:34px;display:block}

/* ---------- shared sidebar shapes ---------- */
.side{width:232px;flex:none;display:flex;flex-direction:column;padding:26px 16px 20px}
.side .logo-wrap{padding:0 10px 26px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:9px;font-size:14.5px;font-weight:600;text-decoration:none;color:inherit}
.nav .grp{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:18px 12px 6px;opacity:.5}
.side .foot{margin-top:auto;font-size:11.5px;opacity:.55;padding:0 12px;line-height:1.7}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:72px;display:flex;align-items:center;gap:16px;padding:0 32px;flex:none}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
.top .sp{flex:1}
.range{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:9px;font-size:13.5px;font-weight:600}
.btn{height:38px;padding:0 16px;border-radius:9px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;border:0}
.seg{display:flex;padding:3px;border-radius:10px;gap:2px}
.seg span{height:32px;padding:0 12px;display:flex;align-items:center;font-size:13px;font-weight:600;border-radius:7px}
.content{flex:1;padding:4px 32px 28px;display:grid;gap:16px;min-height:0}
.card{border-radius:14px;padding:20px 22px;min-width:0}
.card h3{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 small{margin-left:auto;font-size:12px;font-weight:500;opacity:.55}
.kpi .lab{font-size:13px;font-weight:600;opacity:.7}
.kpi .val{font-size:30px;font-weight:800;margin-top:8px}
.kpi .val em{font-style:normal;font-size:17px;font-weight:700;margin-left:2px;opacity:.75}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;margin-top:8px}
.delta i{font-style:normal;font-weight:500;opacity:.7}
.rank{margin-top:12px;display:flex;flex-direction:column}
.rank .r{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:9px 0;font-size:13.5px}
.rank .r b{font-weight:800;font-size:12.5px;opacity:.6}
.rank .r .nm{font-weight:600}
.rank .bar{grid-column:2/4;height:5px;border-radius:3px;margin-top:-4px}
.rank .bar i{display:block;height:100%;border-radius:3px}
.chart{width:100%;display:block}
.legend{display:flex;gap:14px;font-size:12px;font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.legend span:before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.feed .row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 0;font-size:13.5px}
.feed .row .t{font-weight:700;opacity:.6;font-size:12.5px}
.feed .row .who{font-weight:600}
.feed .row .who small{display:block;font-size:12px;font-weight:500;opacity:.6;margin-top:2px}
.pill{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px}
.donut{display:flex;align-items:center;gap:20px;margin-top:14px}
.donut .lg{flex:1;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.donut .lg div{display:flex;align-items:center;gap:8px}
.donut .lg div:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.donut .lg b{margin-left:auto;font-weight:800}
.donut .lg i{font-style:normal;opacity:.55;font-size:12.5px;width:72px;text-align:right}

/* ---------- V1 Clean Blue ---------- */

.v1 .side{background:#fff;border-right:1px solid #e8ebf2}
.v1 .nav a{color:#4a5263}

.v1 .top{background:transparent}

.v3 .btn.p{background:#2c5fff;color:#fff}
.v3 .card{background:#131a2a;border:1px solid #212b3e}
.v3 .content{grid-template-columns:repeat(12,1fr);grid-template-rows:auto 1fr 1fr}

/* ---------- V4 Today first ---------- */

.v4 .nav a{color:#4a5263}
.v4 .nav a.on{background:#131a2a;color:#fff}
.v4 .range{background:#fff;border:1px solid #e3e6ec}
.v4 .btn.p{background:#2c5fff;color:#fff}
.v4 .card{background:#fff;border:1px solid #eceef2}
.v4 .content{grid-template-columns:repeat(12,1fr);grid-template-rows:auto 1fr}

.v4 .today>div{padding:22px 24px;border-right:1px solid rgba(255,255,255,.08)}
.v4 .today>div:last-child{border-right:0}
.v4 .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#7fa2ff;background:rgba(44,95,255,.16);padding:4px 9px;border-radius:999px}
.v4 .live:before{content:"";width:7px;height:7px;border-radius:50%;background:#5b87ff;box-shadow:0 0 0 4px rgba(91,135,255,.25)}
.v4 .delta{color:#2c5fff}
.v4 .feedcard{grid-column:9/13;grid-row:1/3}
.v4 .feed .row{border-bottom:1px solid #f0f2f5}
.v4 .rank .r{border-bottom:1px solid #f0f2f5}
.v4 .rank .bar{background:#eef1f6}.v4 .rank .bar i{background:#2c5fff}

/* ---------- V5 Top nav editorial ---------- */
.v5{background:#fbfbfa;color:#141414;flex-direction:column}
.v5 .topnav{height:64px;display:flex;align-items:center;gap:28px;padding:0 40px;border-bottom:1px solid #e9e9e6;flex:none;background:#fff}
.v5 .topnav a{font-size:14px;font-weight:600;color:#6b6b68;text-decoration:none;height:64px;display:flex;align-items:center;border-bottom:2px solid transparent}
.v5 .topnav a.on{color:#141414;border-color:#2c5fff}
.v5 .topnav .sp{flex:1}
.v5 .head{padding:30px 40px 0;display:flex;align-items:flex-end;gap:16px}
.v5 .head h1{font-size:30px;font-weight:800;letter-spacing:-.03em}
.v5 .head p{font-size:14px;color:#6b6b68;margin-bottom:4px}
.v5 .head .sp{flex:1}
.v5 .seg{background:#f0f0ed}.v5 .seg span.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.v5 .big{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;padding:26px 40px 22px;gap:0;border-bottom:1px solid #e9e9e6}
.v5 .big>div{padding-right:28px}
.v5 .big>div+div{padding-left:28px;border-left:1px solid #e9e9e6}
.v5 .big .lab{font-size:13px;font-weight:600;color:#6b6b68}
.v5 .big .val{font-size:44px;font-weight:800;letter-spacing:-.04em;margin-top:8px}
.v5 .big .val em{font-size:20px;font-style:normal;margin-left:3px;color:#6b6b68}
.v5 .delta{color:#2c5fff}
.v5 .body{display:grid;grid-template-columns:1.75fr 1fr;flex:1;min-height:0}
.v5 .body>div{padding:22px 40px}
.v5 .body>div+div{border-left:1px solid #e9e9e6;padding-left:32px}
.v5 h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.v5 h3 small{margin-left:auto;font-size:12px;font-weight:500;color:#8b8b88}
.v5 .rank .r{border-bottom:1px solid #efefec}
.v5 .rank .bar{background:#efefec}.v5 .rank .bar i{background:#141414}

/* ---------- V6 Forest (green brand refined) ---------- */
.v6{background:#f4f2ec;color:#1f2a1f}
.v6 .side{background:#18301f;color:#dfe8d9}
.v6 .nav a{color:#a9bba4}

.v6 .range{background:#fff;border:1px solid #e2ddd0}

.v6 .content{grid-template-columns:repeat(12,1fr);grid-template-rows:auto 1fr 1fr}
.v6 .delta{color:#2e6b3f}
.v6 .rank .r{border-bottom:1px solid #efeadf}
.v6 .rank .bar{background:#efeadf}.v6 .rank .bar i{background:#2e6b3f}
</style>

<div id="board"></div>

<script>
// Same sample numbers as the current dashboard capture (2026-10-01 ~ 10-20).
const DAYS = Array.from({length:20},(_,i)=>i+1);
// 10/1(목)~10/20(화). 주말·개천절·한글날은 휴무(0건). 합계 1,423건 × 7,000원 = 9,961,000원.
const CLOSED = new Set([3,4,9,10,11,17,18]);
const OPEN_COUNTS = [108,96,112,118,121,114,110,117,124,98,105,112,88];
const COUNTS = (()=>{let k=0; return DAYS.map(d=> CLOSED.has(d) ? 0 : OPEN_COUNTS[k++]);})();
const AMOUNTS = COUNTS.map(c=>c*7000);
const TOTAL_AMOUNT = 9961000, TOTAL_COUNT = 1423;
const BY_AMOUNT = [['한빛테크',3150000],['초록물산',2471000],['대성정밀',1890000],['미래로직스',1120000],['개인 구매',980000]];
const BY_COUNT = [['한빛테크',450],['초록물산',353],['대성정밀',270],['미래로직스',160],['개인 구매',140]];
const MEAL = [['중식',78,1110,7770000],['석식',22,313,2191000]];
const FEED = [['12:50','김민준','한빛테크','식권'],['12:46','이서연','초록물산','장부'],['12:42','박도윤','대성정밀','식권'],['12:38','최하은','한빛테크','식권'],['12:34','정우진','초록물산','장부'],['12:30','강지우','대성정밀','식권'],['12:26','김민준','한빛테크','식권']];
const won = n => n.toLocaleString('ko-KR');
const ic = id => `<svg class="ic"><use href="#i-${id}"/></svg>`;

const NAV = [['home','대시보드'],['live','실시간 매출'],null,['biz','업체 정보'],['settle','매출 정산'],['doc','증빙 내역'],null,['cup','식당 관리'],['gear','공급자 정보']];
function sideNav(groups){
  let g=0, out='';
  NAV.forEach((n,i)=>{
    if(!n){ out+= groups ? `<div class="grp">${groups[++g]}</div>` : '<div style="height:14px"></div>'; return; }
    out+=`<a class="${i===0?'on':''}">${ic(n[0])}${n[1]}</a>`;
  });
  return (groups?`<div class="grp" style="padding-top:0">${groups[0]}</div>`:'')+out;
}
function side(logo, groups){
  return `<aside class="side"><div class="logo-wrap"><img class="logo" src="../../apps/admin/public/brand/${logo}" alt="그린잇"></div>
  <nav class="nav">${sideNav(groups)}</nav>
  <div class="foot"><div style="display:flex;gap:10px;margin-bottom:10px;opacity:1">${ic('refresh')}새로고침</div><div style="display:flex;gap:10px;margin-bottom:14px">${ic('out')}로그아웃</div>개인정보 처리방침 · 이용약관</div></aside>`;
}
function delta(v, txt='전 기간 대비'){ return `<div class="delta">${ic('up')}${v}% <i>${txt}</i></div>`; }

// Charts ---------------------------------------------------------------
function area(w,h,vals,{stroke,fill,grid='#eef0f5',axis='#8a93a6',pad=[14,8,22,40],bars=null,barFill=null,labelsEvery=3,fmt=v=>v}={}){
  const [t,r,b,l]=pad, W=w-l-r, H=h-t-b, max=Math.max(...vals)*1.12;
  const x=i=>l+ (vals.length===1?0: i*(W/(vals.length-1))), y=v=>t+H-(v/max)*H;
  let g='';
  for(let k=0;k<=3;k++){const yy=t+H*k/3; g+=`<line x1="${l}" x2="${w-r}" y1="${yy}" y2="${yy}" stroke="${grid}"/><text x="${l-8}" y="${yy+4}" font-size="10.5" text-anchor="end" fill="${axis}">${fmt(Math.round(max*(1-k/3)))}</text>`;}
  let lbl=''; vals.forEach((_,i)=>{ if(i%labelsEvery===0) lbl+=`<text x="${x(i)}" y="${h-4}" font-size="10.5" text-anchor="middle" fill="${axis}">10.${String(i+1).padStart(2,'0')}</text>`;});
  let barsSvg='';
  if(bars){ const bw=W/vals.length*0.56, bmax=Math.max(...bars)*1.12; bars.forEach((v,i)=>{const bh=(v/bmax)*H; barsSvg+=`<rect x="${x(i)-bw/2}" y="${t+H-bh}" width="${bw}" height="${bh}" rx="3" fill="${barFill}"/>`;}); }
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const id='g'+Math.random().toString(36).slice(2,7);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" height="${h}"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${fill}" stop-opacity=".28"/><stop offset="1" stop-color="${fill}" stop-opacity="0"/></linearGradient></defs>${g}${barsSvg}
   ${fill?`<polygon points="${l},${t+H} ${pts} ${x(vals.length-1)},${t+H}" fill="url(#${id})"/>`:''}
   <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${lbl}</svg>`;
}
function bars(w,h,vals,{fill,today='#2c5fff',closed='#c3c8d2',grid='#eef0f5',axis='#8a93a6',pad=[14,6,24,44],fmt=v=>v,line=null,lineColor='#14b8a6',radius=4}={}){
  const [t,r,b,l]=pad, W=w-l-r, H=h-t-b, max=Math.max(...vals)*1.15, n=vals.length, slot=W/n, bw=Math.min(28,slot*0.62);
  let g='';
  for(let k=0;k<=3;k++){const yy=t+H*k/3; g+=`<line x1="${l}" x2="${w-r}" y1="${yy}" y2="${yy}" stroke="${grid}"/><text x="${l-8}" y="${yy+4}" font-size="10.5" text-anchor="end" fill="${axis}">${fmt(Math.round(max*(1-k/3)))}</text>`;}
  let out='';
  vals.forEach((v,i)=>{
    const cx=l+slot*i+slot/2, d=i+1;
    if(v===0){ out+=`<text x="${cx}" y="${t+H-6}" font-size="10" text-anchor="middle" fill="${closed}">휴무</text>`; }
    else { const bh=(v/max)*H; out+=`<rect x="${cx-bw/2}" y="${t+H-bh}" width="${bw}" height="${bh}" rx="${radius}" fill="${i===n-1?today:fill}"/>`; }
    if(i%2===0 || i===n-1) out+=`<text x="${cx}" y="${h-6}" font-size="10.5" text-anchor="middle" fill="${i===n-1?today:axis}" font-weight="${i===n-1?700:400}">${i===n-1?'오늘':'10.'+String(d).padStart(2,'0')}</text>`;
  });
  if(line){ const lm=Math.max(...line)*1.15; const pts=line.map((v,i)=>v?`${l+slot*i+slot/2},${t+H-(v/lm)*H}`:null).filter(Boolean).join(' ');
    out+=`<polyline points="${pts}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linejoin="round" stroke-dasharray="0"/>`; }
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" height="${h}">${g}${out}</svg>`;
}
function spark(vals,color,w=120,h=36){
  const max=Math.max(...vals), x=i=>i*(w/(vals.length-1)), y=v=>h-2-(v/max)*(h-4);
  const bw=w/vals.length*0.6;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${vals.map((v,i)=>v?`<rect x="${i*(w/vals.length)}" y="${h-(v/max)*(h-2)}" width="${bw}" height="${(v/max)*(h-2)}" rx="1.5" fill="${color}" opacity="${i===vals.length-1?1:.45}"/>`:'').join('')}</svg>`;
}
function donut(size,colors,track){
  const r=size/2-10, c=2*Math.PI*r, a=MEAL[0][1]/100*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="14"/>
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${colors[1]}" stroke-width="14" stroke-dasharray="${c} ${c}"/>
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${colors[0]}" stroke-width="14" stroke-dasharray="${a} ${c}" stroke-linecap="butt"/></svg>`;
}
function mealList(colors){ return `<div class="lg">${MEAL.map((m,i)=>`<div style="--c:${colors[i]}">${m[0]}<i class="num">${won(m[2])}건</i><b class="num">${m[1]}%</b></div>`).join('')}</div>`; }
function rank(rows,unit,max){ return `<div class="rank">${rows.map((r,i)=>`<div class="r"><b class="num">${i+1}</b><span class="nm">${r[0]}</span><span class="num" style="font-weight:700">${won(r[1])}${unit}</span><div class="bar"><i style="width:${r[1]/max*100}%"></i></div></div>`).join('')}</div>`; }
