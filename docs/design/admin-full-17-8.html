<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>관리자 전체 페이지 시안 · 17-8 Calm Dark</title>
<style>
@font-face{font-family:Pretendard;font-weight:400;src:url(../../apps/admin/public/fonts/Pretendard-Regular.otf)}
@font-face{font-family:Pretendard;font-weight:600;src:url(../../apps/admin/public/fonts/Pretendard-SemiBold.otf)}
@font-face{font-family:Pretendard;font-weight:700;src:url(../../apps/admin/public/fonts/Pretendard-Bold.otf)}
@font-face{font-family:Pretendard;font-weight:800;src:url(../../apps/admin/public/fonts/Pretendard-ExtraBold.otf)}
:root{--bg:#0a0d14;--panel:#131a2a;--hi:#1b2436;--line:#212b3e;--dash:#232d44;--fg:#e9edf5;--mut:#8a93a6;--dim:#6b7489;--blue:#2c5fff;--bs:#5b87ff;--paper:#f4f1e9;--red:#ff6b6b;--amber:#f5b54a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,sans-serif;background:#d9dde5;padding:40px;color:var(--fg);-webkit-font-smoothing:antialiased}
.slot{margin:0 auto 56px;width:1440px}
.slot>h2{font-size:22px;font-weight:800;margin-bottom:4px;color:#111}
.slot>p{font-size:14px;color:#4a5263;margin-bottom:14px}
.frame{width:1440px;height:900px;overflow:hidden;border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.25);display:flex;background:var(--bg)}
.frame.tall{height:1180px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* sidebar */
.side{width:236px;flex:none;display:flex;flex-direction:column;padding:26px 16px 20px;border-right:1px solid var(--hi)}
.side .logo{height:34px;margin:0 10px 26px;display:block;align-self:flex-start}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:11px;font-weight:700;letter-spacing:.08em;padding:18px 12px 6px;color:#5c6680}
.nav .grp:first-child{padding-top:0}
.nav a{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:10px;font-size:14.5px;font-weight:600;color:var(--mut);position:relative}
.nav a.on{background:var(--paper);color:#131a2a;-webkit-mask:radial-gradient(circle 7px at 100% 50%,transparent 6.5px,#000 7px);mask:radial-gradient(circle 7px at 100% 50%,transparent 6.5px,#000 7px)}
.nav a .badge{margin-left:auto;background:var(--blue);color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px}
.nav a.on .badge{margin-right:6px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.side .foot a{display:flex;align-items:center;gap:12px;height:38px;padding:0 12px;font-size:14px;font-weight:600;color:var(--mut)}
.side .legal{font-size:11.5px;color:#5c6680;padding:10px 12px 0}
.me{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:8px;border-radius:12px;background:var(--panel)}
.me .av{width:34px;height:34px;border-radius:10px;background:var(--blue);display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
.me b{font-size:13.5px;display:block}.me small{font-size:11.5px;color:var(--mut)}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:76px;display:flex;align-items:center;gap:14px;padding:0 32px;flex:none}
.top h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.top .sub{font-size:13px;color:var(--mut);font-weight:600}
.top .sp{flex:1}
.range{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13.5px;font-weight:600}
.seg{display:flex;padding:3px;border-radius:11px;gap:2px;background:var(--panel);border:1px solid var(--line)}
.seg span{height:32px;padding:0 13px;display:flex;align-items:center;font-size:13px;font-weight:600;border-radius:8px;color:var(--mut)}
.seg span.on{background:var(--paper);color:#131a2a}
.tabs{display:flex;gap:6px;padding:0 32px 14px;flex:none;flex-wrap:wrap}
.tabs span{height:36px;padding:0 14px;display:flex;align-items:center;gap:7px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--mut);border:1px solid var(--line)}
.tabs span.on{background:var(--paper);color:#131a2a;border-color:var(--paper)}
.tabs span i{font-style:normal;background:var(--blue);color:#fff;font-size:11px;font-weight:800;padding:1px 6px;border-radius:999px}
.content{flex:1;padding:4px 32px 28px;display:grid;gap:16px;min-height:0;align-content:start}

/* surfaces */
.dp{background:var(--panel);border-radius:14px;padding:20px 22px;min-width:0;min-height:0;position:relative}
.dp h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;color:#fff}
.dp h3 small{font-size:12px;color:var(--dim);font-weight:500}
.dp h3 .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.dp .desc{font-size:13px;color:var(--mut);margin-top:4px}
.dp hr{border:0;border-top:2px dashed var(--dash);margin:16px 0}
.dk{--stub:96px;background:var(--panel);border-radius:14px;display:grid;grid-template-columns:1fr var(--stub);position:relative;min-width:0;min-height:0}
.dk:before,.dk:after{content:"";position:absolute;right:calc(var(--stub) - 11px);width:22px;height:22px;border-radius:50%;background:var(--bg)}
.dk:before{top:-11px}.dk:after{bottom:-11px}
.dk .l{padding:18px 20px;display:flex;flex-direction:column;min-width:0}
.dk .l small{font-size:12.5px;font-weight:600;color:var(--mut)}
.dk .l .am{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:auto;white-space:nowrap}
.dk .l .am em{font-style:normal;font-size:14px;color:var(--mut);margin-left:2px}
.dk .r{border-left:2px dashed #2a3550;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:0 6px}
.dk .r b{font-size:16px;font-weight:800;color:#7fa2ff}
.dk .r span{font-size:11px;font-weight:600;color:var(--dim)}
.dk.b{background:var(--blue)}.dk.b .l small,.dk.b .am em,.dk.b .r span{color:#dfe7ff}.dk.b .r{border-left-color:rgba(255,255,255,.4)}.dk.b .r b{color:#fff}
.dk.red .r b{color:var(--red)}

/* form */
.f{display:flex;flex-direction:column;gap:7px;min-width:0}
.f label{font-size:12.5px;font-weight:600;color:var(--mut)}
.in{height:44px;border-radius:10px;background:#0f1420;border:1px solid var(--line);display:flex;align-items:center;padding:0 14px;font-size:14px;color:var(--fg);gap:8px}
.in.ph{color:#525c72}
.in.ta{height:auto;min-height:110px;align-items:flex-start;padding-top:12px;line-height:1.7;white-space:pre-line}
.in.focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(44,95,255,.22)}
.in .sfx{margin-left:auto;color:var(--dim);font-size:13px;font-weight:600}
.in.ro{background:transparent;border-style:dashed;color:var(--fg)}
.drop{border:2px dashed #2a3550;border-radius:12px;display:flex;align-items:center;gap:14px;padding:16px 18px;color:var(--mut);font-size:13.5px}
.drop .th{width:56px;height:56px;border-radius:10px;background:var(--hi);display:grid;place-items:center;color:var(--bs)}
.btn{height:44px;padding:0 18px;border-radius:10px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;white-space:nowrap}
.btn.p{background:var(--blue);color:#fff}
.btn.s{background:transparent;color:var(--fg);border-color:#2a3550}
.btn.g{background:var(--hi);color:var(--fg)}
.btn.d{background:transparent;color:var(--red);border-color:rgba(255,107,107,.35)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.dis{opacity:.4}
.chk{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600}
.chk i{width:20px;height:20px;border-radius:6px;border:1.5px solid #3d4a66;display:grid;place-items:center}
.chk i.on{background:var(--blue);border-color:var(--blue)}
.chk i.on:after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.radio i{border-radius:50%}
.radio i.on:after{width:8px;height:8px;border:0;border-radius:50%;background:#fff;transform:none}
.tgl{display:inline-block;vertical-align:middle;width:40px;height:23px;border-radius:999px;background:#2a3550;position:relative;flex:none}
.tgl:after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#8a93a6}
.tgl.on{background:var(--blue)}.tgl.on:after{left:20px;background:#fff}
.choice{border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.choice.on{border-color:var(--blue);background:rgba(44,95,255,.08)}
.choice b{font-size:14.5px;display:block}.choice small{font-size:12.5px;color:var(--mut)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12px;color:var(--dim);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 12px;border-bottom:2px dashed var(--dash);font-weight:500;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right}
.tbl td b{font-weight:700}
.tbl tr.sel td{background:rgba(44,95,255,.07)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.blue{background:rgba(44,95,255,.18);color:#9db6ff}
.pill.gray{background:var(--hi);color:#aab2c2}
.pill.ok{background:rgba(91,135,255,.16);color:#c7d5ff}
.pill.warn{background:rgba(245,181,74,.14);color:#f5c26b}
.pill.red{background:rgba(255,107,107,.14);color:#ff9a9a}
.pill.paper{background:var(--paper);color:#131a2a}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot:before{display:none}
.feed .row{display:grid;grid-template-columns:62px 1fr auto auto;gap:12px;align-items:center;padding:12px 0;font-size:13.5px;border-bottom:2px dashed var(--dash)}
.feed .row:last-child{border-bottom:0}
.feed .t{font-weight:700;color:var(--dim);font-size:12.5px}
.feed .who{font-weight:600}.feed .who small{display:block;font-size:12px;color:var(--dim);font-weight:500;margin-top:2px}
.empty{border:2px dashed #2a3550;border-radius:12px;padding:30px;text-align:center;color:var(--mut);font-size:13.5px}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.note{background:rgba(44,95,255,.08);border-radius:10px;padding:12px 16px;font-size:13px;color:#b9c8f0;line-height:1.7}
.rank .r{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:10px 0;font-size:13.5px;border-bottom:2px dashed var(--dash)}
.rank .r b{font-weight:800;font-size:12.5px;color:var(--dim)}
.rank .bar{grid-column:2/4;height:5px;border-radius:3px;margin-top:-4px;background:var(--hi)}
.rank .bar i{display:block;height:100%;border-radius:3px;background:var(--bs)}
.months{display:flex;gap:6px}
.months span{height:34px;min-width:44px;padding:0 10px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--mut);background:var(--panel)}
.months span.on{background:var(--paper);color:#131a2a}
.months span.off{color:#3d4a66}
.thumb{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#24324f,#131a2a);display:grid;place-items:center;color:var(--bs)}
.star{color:#f5c26b;letter-spacing:1px}
.qr{width:220px;height:220px;border-radius:14px;background:var(--paper);padding:16px}
.qr svg{width:100%;height:100%}
.ticketmini{background:var(--paper);color:#131a2a;border-radius:12px;display:grid;grid-template-columns:1fr 92px;position:relative;--bg:#131a2a}
.ticketmini:before,.ticketmini:after{content:"";position:absolute;right:81px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.ticketmini:before{top:-10px}.ticketmini:after{bottom:-10px}
.ticketmini .l{padding:14px 18px}
.ticketmini .r{border-left:2px dashed #cfc7b4;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kick{font-size:11px;font-weight:800;letter-spacing:.14em;color:#8b8371}
.phone{width:300px;height:600px;border-radius:40px;background:#000;padding:10px;flex:none}
.phone .sc{width:100%;height:100%;border-radius:31px;background:var(--bg);overflow:hidden;padding:40px 16px 16px;display:flex;flex-direction:column;gap:10px}
.banner{height:96px;border-radius:12px;background:linear-gradient(120deg,#2c5fff,#1b2b66);display:flex;align-items:center;padding:0 22px;font-weight:800;font-size:18px;color:#fff;position:relative;overflow:hidden}
.banner small{display:block;font-size:12px;font-weight:600;opacity:.75;margin-top:4px}
.login{flex:1;display:grid;grid-template-columns:1.1fr 1fr}
</style>
</head>

<script>
const ic = id => `<svg class="ic"><use href="#i-${id}"/></svg>`;
const won = n => n.toLocaleString('ko-KR');
// sample data (fictional)
const DAYS = Array.from({length:20},(_,i)=>i+1);
const CLOSED = new Set([3,4,9,10,11,17,18]);
const OPEN = [108,96,112,118,121,114,110,117,124,98,105,112,88];
const COUNTS = (()=>{let k=0;return DAYS.map(d=>CLOSED.has(d)?0:OPEN[k++]);})();
const AMOUNTS = COUNTS.map(c=>c*7000);
const TOTAL_COUNT = 1423, TOTAL_AMOUNT = 9961000;
const COMP = [['한빛테크',3150000,450],['초록물산',2471000,353],['대성정밀',1890000,270],['미래로직스',1120000,160],['개인 구매',980000,140]];
const FEED = [['12:50','김민준','한빛테크','식권'],['12:46','이서연','초록물산','장부'],['12:42','박도윤','대성정밀','식권'],['12:38','최하은','한빛테크','식권'],['12:34','정우진','초록물산','장부'],['12:30','강지우','대성정밀','식권'],['12:26','윤서아','미래로직스','식권'],['12:22','한도현','한빛테크','장부'],['12:18','오지민','개인 구매','식권']];
const kfmt = v => v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?Math.round(v/1e3)+'K':v;

function bars(w,h,vals,{fill='#2a3550',today='#2c5fff',grid='#1b2436',axis='#6b7489',closed='#3d4a66',pad=[14,6,24,44],fmt=v=>v,every=2,radius=4}={}){
  const [t,r,b,l]=pad,W=w-l-r,H=h-t-b,max=Math.max(...vals)*1.15,n=vals.length,slot=W/n,bw=Math.min(28,slot*.62);
  let g='';for(let k=0;k<=3;k++){const yy=t+H*k/3;g+=`<line x1="${l}" x2="${w-r}" y1="${yy}" y2="${yy}" stroke="${grid}"/><text x="${l-8}" y="${yy+4}" font-size="10.5" text-anchor="end" fill="${axis}">${fmt(Math.round(max*(1-k/3)))}</text>`;}
  let o='';vals.forEach((v,i)=>{const cx=l+slot*i+slot/2;
    if(!v){if(slot>=24)o+=`<text x="${cx}" y="${t+H-6}" font-size="10" text-anchor="middle" fill="${closed}">휴무</text>`;}
    else{const bh=v/max*H;o+=`<rect x="${cx-bw/2}" y="${t+H-bh}" width="${bw}" height="${bh}" rx="${radius}" fill="${i===n-1?today:fill}"/>`;}
    if((i%every===0&&i<n-2)||i===n-1)o+=`<text x="${cx}" y="${h-6}" font-size="10.5" text-anchor="middle" fill="${i===n-1?'#7fa2ff':axis}" font-weight="${i===n-1?700:400}">${i===n-1?'오늘':'10.'+String(i+1).padStart(2,'0')}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block">${g}${o}</svg>`;
}
