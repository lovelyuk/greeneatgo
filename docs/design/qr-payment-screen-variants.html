<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내 QR 하단 버튼 · 결제창 로딩/오류 시안</title>
<style>
@font-face{font-family:P;src:url('../../apps/admin/public/fonts/Pretendard-SemiBold.otf');font-weight:600}
@font-face{font-family:P;src:url('../../apps/admin/public/fonts/Pretendard-ExtraBold.otf');font-weight:800}
*{box-sizing:border-box;margin:0}
:root{--bg:#0A0D14;--card:#131A2A;--hi:#1B2436;--line:#212B3E;--blue:#2C5FFF;--bs:#5B87FF;--fg2:#8A93A6;--danger:#FF7A7A}
body{background:#1c2130;font-family:P,sans-serif;font-weight:600;color:#fff;padding:24px}
h2.g{font-size:24px;font-weight:800;margin:4px 0}
p.gd{color:#a9b2c4;font-size:14.5px;margin-bottom:16px}
.row{display:flex;gap:26px;margin-bottom:40px;flex-wrap:wrap}
.wrap{width:390px;padding-top:58px;position:relative}
.cap{position:absolute;top:0;left:4px;right:0;font-size:15px;font-weight:800;line-height:1.35}
.cap small{display:block;font-size:12.5px;font-weight:600;color:#a9b2c4}
.ph{width:390px;height:780px;border-radius:40px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 0 0 9px #05070b,0 20px 50px rgba(0,0,0,.4);display:flex;flex-direction:column}
.sb{height:40px;flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:13px}
.ab{height:52px;display:flex;align-items:center;gap:14px;padding:0 18px;font-size:17px;font-weight:800}
.ab span{font-size:22px;color:#c9d0de}
.body{flex:1;padding:4px 18px 0;display:flex;flex-direction:column}
.ov{font-size:12px;letter-spacing:.24em;color:var(--bs)}
.t1{font-size:26px;font-weight:800;margin-top:6px}
.cp{color:var(--fg2);font-size:13.5px;margin-top:6px}
.qrcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 18px;margin-top:16px;text-align:center}
.qr{width:220px;height:220px;margin:0 auto;border-radius:16px;background:#fff;padding:12px}
.qr i{display:block;width:100%;height:100%;background:
 conic-gradient(from 90deg at 10px 10px,#0A0D14 25%,#fff 0) 0 0/20px 20px}
.qr i{background-image:repeating-linear-gradient(90deg,#111 0 9px,#fff 9px 18px),repeating-linear-gradient(0deg,#111 0 9px,#fff 9px 18px);background-blend-mode:difference;filter:contrast(1.4)}
.tm{color:var(--bs);font-size:13px;margin-top:14px}
.tm2{color:var(--fg2);font-size:12.5px;margin-top:4px}
/* fallback variants */
.f1{margin-top:16px;height:52px;border-radius:16px;background:var(--hi);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:800;color:#c9d0de}
.f1 b{color:var(--bs);font-size:18px}
.f2{margin-top:18px;text-align:center;font-size:14px;color:var(--fg2)}
.f2 a{color:var(--bs);font-weight:800;text-decoration:none;margin-left:6px}
.f3{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px}
.f3 i{font-style:normal;width:40px;height:40px;border-radius:12px;background:rgba(44,95,255,.16);color:var(--bs);display:grid;place-items:center;font-size:20px}
.f3 b{display:block;font-size:15px}.f3 small{display:block;color:var(--fg2);font-size:12.5px;margin-top:2px}
.f3 .ch{margin-left:auto;color:var(--fg2);font-size:20px}
.tabbar{margin:auto 0 12px;height:64px;border-radius:22px;background:var(--card);border:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;text-align:center;font-size:11px;color:var(--fg2)}
.tabbar .on{color:var(--blue)}
/* payment states */
.web{position:absolute;inset:92px 0 0;background:#f2f3f5}
.web .k{margin:22px;height:60px;border-radius:8px;background:#e1e4ea}
.web .k2{margin:0 22px;height:300px;border-radius:8px;background:#e8eaef}
.ld{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px}
.ring{width:84px;height:84px;border-radius:50%;border:5px solid rgba(91,135,255,.16);border-top-color:var(--bs);border-right-color:var(--bs);margin-bottom:22px}
.ld h1{font-size:21px;font-weight:800}.ld p{color:var(--fg2);font-size:14px;margin-top:8px;line-height:1.5}
.e1{flex:1;display:flex;flex-direction:column;padding:8px 22px 18px}
.e1 h1{font-size:26px;font-weight:800;line-height:1.25}
.e1 .s{color:var(--fg2);font-size:14.5px;margin-top:8px}
.msg{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:24px}
.msg i{font-style:normal;flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:rgba(255,122,122,.14);color:var(--danger);display:grid;place-items:center;font-weight:800}
.msg b{display:block;font-size:15px}.msg span{display:block;color:var(--fg2);font-size:13px;margin-top:3px;line-height:1.45}
.btm{margin-top:auto;display:grid;gap:8px}
.bp{height:54px;border-radius:16px;background:var(--blue);display:grid;place-items:center;font-size:16px;font-weight:800}
.bs2{height:50px;border-radius:16px;background:var(--hi);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:800;color:#c9d0de}
.ctr{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 26px 18px}
.ill{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#2a1b24 0%,#131A2A 72%);display:grid;place-items:center;font-size:52px;margin-bottom:24px;box-shadow:0 0 0 12px rgba(255,122,122,.05)}
.ill.b{background:radial-gradient(circle,#1b2a55 0%,#131A2A 72%);box-shadow:0 0 0 12px rgba(44,95,255,.06)}
.ctr h1{font-size:22px;font-weight:800}.ctr p{color:var(--fg2);font-size:14px;margin-top:8px;line-height:1.5}
.ctr .btm{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.chips span{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--hi);color:#c9d0de}
.dim{position:absolute;inset:92px 0 0;background:rgba(5,7,11,.62)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:10px 20px 22px}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.hrow{display:flex;gap:14px;align-items:center}
.hrow i{font-style:normal;flex:0 0 auto;width:50px;height:50px;border-radius:50%;background:rgba(255,122,122,.14);color:var(--danger);display:grid;place-items:center;font-size:24px;font-weight:800}
.hrow .sp{border:4px solid rgba(91,135,255,.16);border-top-color:var(--bs);border-right-color:var(--bs);background:none}
.hrow b{display:block;font-size:18px;font-weight:800}.hrow small{display:block;color:var(--fg2);font-size:13px;margin-top:3px;line-height:1.45}
.sheet .btm{margin-top:18px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const sb='<div class="sb"><span>11:27</span><span>LTE</span></div>';
const tab='<div class="tabbar"><span>홈</span><span>구매</span><span class="on">QR</span><span>내역</span><span>내정보</span></div>';
const qrTop='<div class="ov">MY QR</div><div class="t1">내 식권 QR</div><p class="cp">카운터 스캐너에 화면을 대 주세요. 한 번에 식권 1장이 사용돼요.</p><div class="qrcard"><div class="qr"><i></i></div><p class="tm">33초 후 새 QR로 바뀌어요</p><p class="tm2">화면을 캡처해서 쓸 수 없어요.</p></div>';
const qrScreen=(f)=>`${sb}<div class="ab"><span>←</span>QR 사용하기</div><div class="body">${qrTop}${f}${tab}</div>`;
const Q=[
 ['Q1 다크 보조 버튼','다른 화면의 회색 보조 버튼과 같은 모양. 아이콘만 파랑.',qrScreen('<div class="f1"><b>⌗</b>스캐너가 없나요? 매장 QR 찍어서 결제</div>')],
 ['Q2 글자 링크','눈에 덜 띄게. 평소엔 스캐너를 쓰니 보조 안내로만.',qrScreen('<p class="f2">스캐너가 없나요?<a>매장 QR 찍기 ›</a></p>')],
 ['Q3 안내 카드','설명 한 줄을 붙인 카드형. 처음 쓰는 사람도 이해하기 쉬움.',qrScreen('<div class="f3"><i>⌗</i><div><b>매장 QR 찍어서 결제</b><small>카운터에 스캐너가 없을 때 사용해요</small></div><span class="ch">›</span></div>')],
];
const ab='<div class="ab"><span>←</span>테스트식권 결제</div>';
const web='<div class="web"><div class="k"></div><div class="k2"></div></div>';
const P=[
 ['P1 E1 오류 화면과 동일','앱 전체 오류 화면(E1)과 같은 구조. 로딩은 파란 링.',
  `${sb}${ab}<div class="ld"><div class="ring"></div><h1>결제 승인을 확인하고 있어요</h1><p>완료 화면으로 자동 전환돼요.</p></div>`,
  `${sb}${ab}<div class="e1"><h1>결제를 진행하지 못했어요</h1><p class="s">잠시 후 다시 시도해 주세요.</p><div class="msg"><i>!</i><div><b>결제 앱을 열 수 없어요</b><span>해당 앱이 설치되어 있는지 확인하거나 다른 결제수단을 선택해 주세요.</span></div></div><div class="btm"><div class="bp">다시 결제하기</div><div class="bs2">상품 목록으로 돌아가기</div></div></div>`],
 ['P2 가운데 아이콘','큰 아이콘을 가운데에. 오류 종류에 따라 아이콘만 바뀜. 다른 결제수단 안내 칩.',
  `${sb}${ab}<div class="ctr"><div class="ill b"><div class="ring" style="width:64px;height:64px;margin:0"></div></div><h1>결제 승인을 확인하고 있어요</h1><p>완료 화면으로 자동 전환돼요.<br>앱을 닫지 말고 기다려 주세요.</p></div>`,
  `${sb}${ab}<div class="ctr"><div class="ill">📱</div><h1>결제 앱을 열 수 없어요</h1><p>해당 앱이 설치되어 있는지 확인해 주세요.</p><div class="chips"><span>신용카드</span><span>네이버페이</span><span>카카오페이</span><span>계좌이체</span></div><p style="font-size:12.5px;margin-top:10px">다른 결제수단으로 다시 시도할 수 있어요.</p><div class="btm" style="margin-top:auto"><div class="bp">다시 결제하기</div><div class="bs2">상품 목록으로 돌아가기</div></div></div>`],
 ['P3 결제창 위 바텀시트','결제창(흰 화면)을 뒤에 두고 아래에서 올라오는 안내. 결제 흐름이 끊기지 않는 느낌.',
  `${sb}${ab}${web}<div class="dim"></div><div class="sheet"><div class="grab"></div><div class="hrow"><i class="sp"></i><div><b>결제 승인을 확인하고 있어요</b><small>완료 화면으로 자동 전환돼요.</small></div></div></div>`,
  `${sb}${ab}${web}<div class="dim"></div><div class="sheet"><div class="grab"></div><div class="hrow"><i>!</i><div><b>결제 앱을 열 수 없어요</b><small>해당 앱이 설치되어 있는지 확인하거나<br>다른 결제수단을 선택해 주세요.</small></div></div><div class="btm"><div class="bp">다시 결제하기</div><div class="bs2">상품 목록으로 돌아가기</div></div></div>`],
];
let h=`<section id="qa"><h2 class="g">① 내 QR 화면 — 연두색 버튼 교체</h2><p class="gd">QR·타이머는 그대로, 아래 “스캐너가 없나요?” 버튼만 바꿈</p><div class="row">`;
Q.forEach(([t,d,b])=>h+=`<div class="wrap"><span class="cap">${t}<small>${d}</small></span><div class="ph">${b}</div></div>`);
h+='</div></section>';
P.forEach(([t,d,a,b],i)=>{h+=`<section id="p${i+1}"><h2 class="g">② 결제창 — ${t}</h2><p class="gd">${d} (크림색 바탕·초록 버튼 교체)</p><div class="row"><div class="wrap"><span class="cap">승인 확인 중</span><div class="ph">${a}</div></div><div class="wrap"><span class="cap">오류 (결제 앱을 열 수 없어요)</span><div class="ph">${b}</div></div></div></section>`});
document.getElementById('root').innerHTML=h;
</script>
</body>
</html>
