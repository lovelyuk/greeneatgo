[project]
name = "greeneatgo-api"
version = "0.1.0"
description = "greeneatGo FastAPI service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "fpdf2>=2.8",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "pillow>=11.0",
  "firebase-admin>=6.6",
  "popbill==1.64.2",
  "bcrypt>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "psycopg[binary]>=3.2"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
