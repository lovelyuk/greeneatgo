services:
  - type: web
    name: greeneatgo-api
    runtime: python
    rootDir: services/api
    buildCommand: pip install -e .
    startCommand: bash start.sh
    healthCheckPath: /v1/health
    envVars:
      - key: ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # SOLAPI SMS credentials are server-only; configure them as Render secrets.
      - key: SOLAPI_API_KEY
        sync: false
      - key: SOLAPI_API_SECRET
        sync: false
      - key: SOLAPI_SENDER
        sync: false
      - key: SMS_DRY_RUN
        value: "false"
      - key: OTP_PEPPER
        sync: false
      - key: OTP_BCRYPT_ROUNDS
        value: "12"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_APP_URL
        sync: false
      - key: PUBLIC_API_BASE_URL
        sync: false
      - key: KIWOOMPAY_CPID
        sync: false
      # Optional: not used for payment; required only by automatic cancel/refund API calls.
      - key: KIWOOMPAY_AUTHORIZATION_KEY
        sync: false
      - key: KIWOOMPAY_BASE_URL
        sync: false
      - key: KIWOOMPAY_NOTIFICATION_IPS
        sync: false
      - key: KIWOOMPAY_APP_URL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: INVITE_EMAIL_FROM
        sync: false
      # Firebase Admin SDK: store the service-account JSON as Base64 in Render Secret.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON_BASE64
        sync: false
      # Popbill Taxinvoice SDK: all values are server-only.
      - key: POPBILL_LINK_ID
        sync: false
      - key: POPBILL_SECRET_KEY
        sync: false
      - key: POPBILL_CORP_NUM
        sync: false
      - key: POPBILL_USER_ID
        sync: false
      # Keep the safe test environment default. Production must override this explicitly.
      - key: POPBILL_IS_TEST
        value: "true"
      - key: POPBILL_IP_RESTRICT_ON
        value: "true"
      - key: POPBILL_USE_STATIC_IP
        value: "false"
      - key: POPBILL_USE_LOCAL_TIME
        value: "true"
